<form [formGroup]="formGroup" class="mt-4">
  <div class="field mb-4">
    <label for="title" class="font-bold mb-2 block"
      >標題 (Title) <span class="text-red-500">*</span></label
    >
    <input
      type="text"
      pInputText
      id="title"
      formControlName="title"
      autofocus
      placeholder="例如：2026年出差報帳規範"
      class="w-full"
    />
    <div *ngIf="formControlInvalid('title')">
      <small class="p-error">標題為必填欄位</small>
    </div>
  </div>

  <div class="formgrid grid mb-4">
    <div class="field col-12 md:col-6 mb-0">
      <label for="category" class="font-bold mb-2 block"
        >分類 (Category) <span class="text-red-500">*</span></label
      >

      <p-dropdown
        [options]="categoryOptions"
        formControlName="category"
        placeholder="請選擇分類"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
        [style]="{ width: '100%' }"
      >
      </p-dropdown>

      <small
        class="text-gray-500 mt-1 block"
        *ngIf="action === 'edit' || action === 'EDIT'"
      >
        <i class="pi pi-info-circle"></i>
        若需變更分類，請使用列表上的「轉移分類」快捷功能。
      </small>

      <div *ngIf="formControlInvalid('category')">
        <small class="p-error">分類為必填欄位</small>
      </div>
    </div>

    <div class="field col-12 md:col-6 mb-0 mt-4 md:mt-0">
      <label for="author" class="font-bold mb-2 block"
        >作者 (Author) <span class="text-red-500">*</span></label
      >
      <input
        type="text"
        pInputText
        id="author"
        formControlName="author"
        placeholder="作者名稱"
        class="w-full"
      />
      <div *ngIf="formControlInvalid('author')">
        <small class="p-error">作者為必填欄位</small>
      </div>
    </div>
  </div>

  <div class="field mb-4">
    <label for="tags" class="font-bold mb-2 block">標籤 (Tags)</label>
    <p-autoComplete
      formControlName="tags"
      inputId="tags"
      [multiple]="true"
      [suggestions]="filteredTags"
      (completeMethod)="searchTags($event)"
      [forceSelection]="false"
      [autoHighlight]="true"
      placeholder="輸入關鍵字以搜尋或建立新標籤 (按 Enter 建立)..."
      styleClass="w-full"
      [style]="{ width: '100%' }"
      appendTo="body"
    >
    </p-autoComplete>
    <small class="text-gray-500 mt-1 block">
      <i class="pi pi-info-circle"></i> 可選擇現有標籤，或輸入自定義標籤後按下
      Enter 鍵建立。這將有助於 AI 助理更精準進行 RAG 檢索。
    </small>
  </div>

  <div class="field mb-5">
    <label for="content" class="font-bold mb-2 block"
      >內文 (Content) <span class="text-red-500">*</span></label
    >
    <textarea
      id="content"
      pTextarea
      formControlName="content"
      required
      rows="8"
      placeholder="請輸入文檔的詳細內容... (系統將自動進行 AI 向量化)"
      class="w-full"
    ></textarea>
    <div *ngIf="formControlInvalid('content')">
      <small class="p-error">內文內容不能為空</small>
    </div>
  </div>

  <div class="flex justify-content-end gap-2 pt-3 border-top-1 border-300">
    <p-button
      label="取消"
      icon="pi pi-times"
      severity="secondary"
      [outlined]="true"
      (onClick)="cancel()"
    >
    </p-button>

    <p-button
      [label]="action === 'ADD' ? '新增並向量化' : '更新儲存'"
      icon="pi pi-check"
      (onClick)="submitForm()"
    >
    </p-button>
  </div>
</form>
